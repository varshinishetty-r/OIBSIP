<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoginHub | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-shape shape-one"></div>
    <div class="background-shape shape-two"></div>

    <main class="auth-container">
        <div class="brand">
            <div class="logo">LH</div>
            <h1>LoginHub</h1>
            <p>Your secure digital space</p>
        </div>

        <div class="auth-card">
            <div class="card-heading">
                <span>Welcome back 👋</span>
                <h2>Sign in</h2>
                <p>Enter your credentials to continue.</p>
            </div>

            <form id="loginForm">

                <div class="input-group">
                    <label for="loginUser">Username or Email</label>
                    <input
                        type="text"
                        id="loginUser"
                        placeholder="Enter username or email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="loginPassword">Password</label>

                    <div class="password-box">
                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter password"
                            required
                        >
                        <button type="button" class="show-btn" id="loginToggle">
                            Show
                        </button>
                    </div>
                </div>

                <p id="loginMessage" class="message"></p>

                <button type="submit" class="primary-btn">
                    Login <span>→</span>
                </button>
            </form>

            <div class="switch-page">
                Don't have an account?
                <a href="register.html">Create one</a>
            </div>
        </div>

        <div class="security-note">
            🔐 Passwords are protected using SHA-256 hashing
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
