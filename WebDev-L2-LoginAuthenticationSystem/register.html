<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoginHub | Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-shape shape-one"></div>
    <div class="background-shape shape-two"></div>

    <main class="auth-container">

        <div class="brand">
            <div class="logo">SV</div>
            <h1>LoginHub</h1>
            <p>Create your protected account</p>
        </div>

        <div class="auth-card">

            <div class="card-heading">
                <span>New here? ✨</span>
                <h2>Create account</h2>
                <p>Join LoginHub in a few seconds.</p>
            </div>

            <form id="registerForm">

                <div class="input-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Choose a username"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="registerPassword">Password</label>

                    <div class="password-box">
                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Minimum 8 characters"
                            required
                        >
                        <button type="button" class="show-btn" id="registerToggle">
                            Show
                        </button>
                    </div>
                </div>

                <div class="password-rules">
                    <div id="lengthRule">○ At least 8 characters</div>
                    <div id="numberRule">○ Contains at least 1 number</div>
                </div>

                <p id="registerMessage" class="message"></p>

                <button type="submit" class="primary-btn">
                    Create Account <span>→</span>
                </button>

            </form>

            <div class="switch-page">
                Already have an account?
                <a href="index.html">Sign in</a>
            </div>

        </div>

        <div class="security-note">
            🛡️ Your password is never stored directly
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
